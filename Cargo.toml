[package]
name = "live-radio"
version = "1.1.2"
edition = "2021"
description = "Live Radio - a desktop player for live online radio stations"
license = "MIT"

[dependencies]
eframe = { version = "0.29", default-features = false, features = [
    "glow",
    "default_fonts",
    "wayland",
    "x11",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.24", default-features = false, features = ["png", "jpeg", "webp"] }

[profile.release]
opt-level = 2
lto = "thin"
strip = true
